<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070913" />
  <circle cx="32" cy="32" r="26" stroke="url(#glow)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <!-- Neural hexagon -->
  <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" stroke="url(#glow)" stroke-width="2.5" fill="none" filter="url(#blur)" />
  <!-- Center Core -->
  <circle cx="32" cy="32" r="6" fill="url(#glow)" />
  <!-- Connected Nodes -->
  <circle cx="32" cy="16" r="3" fill="#06b6d4" />
  <circle cx="46" cy="24" r="3" fill="#3b82f6" />
  <circle cx="46" cy="40" r="3" fill="#8b5cf6" />
  <circle cx="32" cy="48" r="3" fill="#06b6d4" />
  <circle cx="18" cy="40" r="3" fill="#3b82f6" />
  <circle cx="18" cy="24" r="3" fill="#8b5cf6" />
  <!-- Cross Connectors -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="url(#glow)" stroke-width="1.2" opacity="0.5" />
  <line x1="18" y1="24" x2="46" y2="40" stroke="url(#glow)" stroke-width="1.2" opacity="0.5" />
  <line x1="18" y1="40" x2="46" y2="24" stroke="url(#glow)" stroke-width="1.2" opacity="0.5" />
</svg>
