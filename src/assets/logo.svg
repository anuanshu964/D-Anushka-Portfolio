<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Monogram Emblem -->
  <polygon points="18,4 32,12 32,28 18,36 4,28 4,12" stroke="url(#cyber-grad)" stroke-width="2.2" fill="rgba(6, 182, 212, 0.08)" />
  <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  <circle cx="18" cy="18" r="1.5" fill="#06b6d4" />

  <!-- Brand Typography -->
  <text x="42" y="23" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="2.5">ANUSHKA</text>
  <text x="145" y="17" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#06b6d4">AI</text>
</svg>
